<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio and Checkbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <input type="checkbox" id="myCheckbox">
    <label for="myCheckbox">Subscribe</label><br>

    <input type="radio" name="card" id="Visabtn" class="card-radio">
    <label for="Visabtn">Visa</label><br>
    <input type="radio" name="card" id="Masterbtn" class="card-radio">
    <label for="Masterbtn">MasterCard</label><br>
    <input type="radio" name="card" id="Paypalbtn" class="card-radio">
    <label for="Paypalbtn">PayPal</label><br>
    
    <button type="submit" id="submitButton">Submit</button>
    
    <p id="subResult"></p>
    <p id="cardResult"></p>    


    <script src="main.js"></script>
</body>
</html>
